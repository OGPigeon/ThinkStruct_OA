<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Search</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f5bd3; --accent-ink: #ffffff; --mark: #fff0a8; --chip: #eef1fb; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9b9a94; --line: #34332f;
            --accent: #7c9cff; --accent-ink: #0d1020; --mark: #5a4a00; --chip: #262b3d; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .stat { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 0; min-height: calc(100vh - 54px); }
  aside { border-right: 1px solid var(--line); padding: 16px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  label { display: block; font-size: 13px; margin: 8px 0 3px; color: var(--muted); }
  input[type=text], select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .check { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--muted); }
  section { padding: 16px 20px; min-width: 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .qbar { display: flex; gap: 8px; align-items: flex-start; }
  .qbar textarea { min-height: 42px; font-size: 15px; }
  .go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .meta { color: var(--muted); font-size: 13px; margin: 12px 0; display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--ink); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .card h3 .doc { color: var(--accent); font-weight: 600; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .chip { background: var(--chip); border-radius: 4px; padding: 1px 7px; font-size: 12px; color: var(--muted); }
  .ev { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 6px 0; font-size: 13.5px; }
  .ev .lbl { font-size: 12px; color: var(--muted); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .err { color: var(--bad); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Patent Search</h1>
  <select id="index" style="width:auto"></select>
  <span class="stat" id="istat"></span>
</header>
<main>
  <aside>
    <h2>Filters</h2>
    <label for="cls">Classification prefixes (comma = OR)</label>
    <input type="text" id="cls" placeholder="B60B, B60C11">
    <label for="kw">Keywords in title/abstract (all required)</label>
    <input type="text" id="kw" placeholder="sensor*, rim">
    <label for="ex">Exclude keywords</label>
    <input type="text" id="ex" placeholder="bicycle">
    <label for="title">Title contains phrase</label>
    <input type="text" id="title" placeholder="vehicle wheel">
    <div class="check"><input type="checkbox" id="texact"><label for="texact" style="margin:0">exact title</label></div>
    <div class="row">
      <div><label for="from">From</label><input type="text" id="from" placeholder="2024-03"></div>
      <div><label for="to">To</label><input type="text" id="to" placeholder="2024-12"></div>
    </div>
    <h2>Ranking</h2>
    <div class="row">
      <div><label for="mode">Mode</label>
        <select id="mode"><option value="hybrid">hybrid (RRF)</option><option value="dense">semantic</option><option value="bm25">BM25</option></select></div>
      <div><label for="k">Results</label><select id="k"><option>10</option><option>20</option><option>50</option></select></div>
    </div>
    <label for="strategy">Vector search plan</label>
    <select id="strategy"><option value="auto">auto (by selectivity)</option><option value="exact">exact</option><option value="filtered">ANN + bitmap</option><option value="postfilter">ANN + post-filter</option></select>
  </aside>
  <section>
    <div class="tabs" id="tabs">
      <button data-t="query" class="on">Query</button><button data-t="claim">Claim text</button><button data-t="patent">Patent number</button>
    </div>
    <div class="qbar">
      <textarea id="q" placeholder="Describe the invention, e.g. tire pressure sensor mounted inside the rim"></textarea>
      <button class="go" id="go">Search</button>
    </div>
    <div class="meta" id="meta"></div>
    <div id="out"><div class="empty">Search by description, paste a claim, or enter a patent number to map its claims.</div></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let tab = "query", seq = 0;
const placeholders = {
  query: "Describe the invention, e.g. tire pressure sensor mounted inside the rim",
  claim: "Paste a claim, e.g. a hub body having a first end and a second end; a driver disposed at the first end ...",
  patent: "US publication number, e.g. 20240051333 (not in the index? it is fetched from Google Patents)"
};
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  tab = b.dataset.t; $("q").placeholder = placeholders[tab];
});
const list = s => s.split(",").map(x => x.trim()).filter(Boolean);
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function mark(text, terms) {
  const t = esc(text);
  if (!terms.length) return t;
  const re = new RegExp("\\b(" + terms.sort((a, b) => b.length - a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\w*", "gi");
  return t.replace(re, m => `<mark>${m}</mark>`);
}
async function loadIndexes() {
  const r = await fetch("/api/indexes").then(r => r.json());
  $("index").innerHTML = r.map(i => `<option value="${i.name}">${i.name}</option>`).join("");
  const show = () => { const i = r.find(x => x.name === $("index").value);
    $("istat").textContent = `${i.patents.toLocaleString()} patents · ${i.chunks.toLocaleString()} passages · ${i.granularity} · ${i.ann}`; };
  $("index").onchange = show; show();
}
async function run() {
  const my = ++seq;  // ignore responses from older requests that arrive late
  const body = { index: $("index").value, k: +$("k").value, mode: $("mode").value, strategy: $("strategy").value,
    filters: { cls: list($("cls").value), keywords: list($("kw").value), exclude: list($("ex").value),
               title: $("title").value.trim() || null, title_exact: $("texact").checked,
               date_from: $("from").value.trim() || null, date_to: $("to").value.trim() || null } };
  const q = $("q").value.trim();
  if (q) body[tab] = q;
  $("meta").textContent = "searching…";
  const t0 = performance.now();
  const resp = await fetch("/api/search", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const r = await resp.json();
  if (my !== seq) return;
  if (!resp.ok) { $("meta").innerHTML = `<span class="err">${esc(r.detail)}</span>`; $("out").innerHTML = ""; return; }
  const tm = r.timings;
  $("meta").innerHTML = [
    `<span><b>${r.results.length}</b> results</span>`,
    r.n_filtered != null ? `<span><b>${r.n_filtered.toLocaleString()}</b> / ${r.n_patents.toLocaleString()} pass filters</span>` : "",
    `<span>plan <b>${esc(r.plan)}</b></span>`,
    `<span>retrieval <b>${tm.retrieval_ms} ms</b> · embed ${tm.embed_ms} ms · round trip ${Math.round(performance.now() - t0)} ms</span>`,
    r.source ? `<span>query patent <b>${esc(r.source.doc_number)}</b> ${esc(r.source.title)}</span>` : ""
  ].join("");
  if (!r.results.length) { $("out").innerHTML = `<div class="empty">No patents match.</div>`; return; }
  $("out").innerHTML = r.results.map(x => `
    <div class="card">
      <h3><span class="doc">${esc(x.doc_number)}</span>${mark(x.title, x.matched_terms)}</h3>
      <div class="chips">
        <span class="chip">${esc(x.classification || "no class")}</span><span class="chip">${esc(x.date || "no date")}</span>
        <span class="chip">semantic #${x.dense_rank ?? "–"}${x.dense_score != null ? " · " + x.dense_score : ""}</span>
        <span class="chip">BM25 #${x.bm25_rank ?? "–"}</span>
        ${x.matched_terms.length ? `<span class="chip">matched: ${esc(x.matched_terms.slice(0, 8).join(", "))}</span>` : ""}
      </div>
      ${x.evidence.map(e => `<div class="ev"><div class="lbl">${esc(e.query)} → best ${e.kind}${e.kind === "abstract" ? "" : " " + e.num} · similarity ${e.score}</div>${mark(e.text, x.matched_terms)}</div>`).join("")}
      <details><summary>abstract</summary><div>${mark(x.abstract, x.matched_terms)}</div></details>
    </div>`).join("");
}
$("go").onclick = run;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); run(); } });
loadIndexes();
</script>
</body>
</html>
